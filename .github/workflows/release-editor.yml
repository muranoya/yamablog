name: Release Editor

on:
  push:
    branches:
      - main
    paths:
      - 'editor/**'

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            rust-targets: ''
            tauri-args: '--bundles appimage'
          - platform: macos-latest
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            tauri-args: '--bundles dmg --target universal-apple-darwin'
          - platform: windows-latest
            rust-targets: ''
            tauri-args: '--bundles nsis'

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: editor/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'editor/src-tauri -> target'
          key: ${{ matrix.platform }}-release

      - name: Install frontend dependencies
        working-directory: editor
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: editor
          tagName: editor-v__VERSION__
          releaseName: 'yamablog editor v__VERSION__'
          generateReleaseNotes: true
          args: ${{ matrix.tauri-args }}

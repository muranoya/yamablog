name: Release Editor

on:
  push:
    branches:
      - main
    paths:
      - 'editor/**'

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version' editor/src-tauri/Cargo.toml \
            | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=editor-v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install Linux system dependencies for Tauri v2
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: editor/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'editor/src-tauri -> target'
          key: editor-release

      - uses: extractions/setup-just@v2

      - name: Build editor
        run: just build-editor

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "yamablog editor ${{ steps.version.outputs.tag }}"
          generate_release_notes: true
          files: |
            editor/src-tauri/target/release/bundle/deb/*.deb
            editor/src-tauri/target/release/bundle/appimage/*.AppImage

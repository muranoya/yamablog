<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ blog_name }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ blog_name }}{% endblock %}">
  <link rel="stylesheet" href="/{{ bundle_css | safe }}">
</head>
<body>
  <header>
    <h1><a href="/">{{ blog_name }}</a></h1>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <aside id="sidebar">
    <div class="sidebar-inner">
      <div id="gpx-map" data-map-data-url="/map-data.json"></div>
      <section class="sidebar-categories">
        <h2>カテゴリ</h2>
        <ul>
        {% for cat in categories_with_counts %}
          <li><a href="/categories/{{ cat.id }}/">{{ cat.name }}({{ cat.count }})</a></li>
        {% endfor %}
        </ul>
      </section>
      <section class="sidebar-monthly">
        <h2>月別</h2>
        <ul>
        {% for m in monthly_counts %}
          <li><a href="/archives/{{ m.month }}/"> {{ m.month }}月 ({{ m.count }})</a></li>
        {% endfor %}
        </ul>
      </section>
    </div>
  </aside>
  <script src="/{{ bundle_js | safe }}"></script>
  <footer>
    <p>&copy; {{ blog_name }}</p>
  </footer>
</body>
</html>
